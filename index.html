let currentLang = localStorage.getItem("moldinvest_lang") || "ro";
let portfolioData = { stocks: [], bonds: [] };

function get(obj, path) {
  return path.split(".").reduce((a, k) => (a && a[k] !== undefined ? a[k] : undefined), obj);
}

function fmtMDL(v) {
  return (Number(v) || 0).toLocaleString("ro-MD", { maximumFractionDigits: 2 }) + " MDL";
}
function fmtPct(v) {
  return (Number(v) || 0).toLocaleString("ro-MD", { maximumFractionDigits: 2 }) + "%";
}

function renderLangSwitch() {
  const langs = ["ro", "ru", "en"];
  const labels = { ro: "RO", ru: "RU", en: "EN" };
  const html = langs.map(code => `
    <button type="button" data-lang="${code}"
      class="lang-btn px-2.5 py-1 text-xs font-semibold rounded-full transition-colors ${currentLang === code ? 'bg-brand-blue text-white shadow-sm' : 'text-slate-500 hover:text-brand-blue'}">
      ${labels[code]}
    </button>`).join("");
  document.getElementById("lang-switch-desktop").innerHTML = html;
  document.getElementById("lang-switch-mobile").innerHTML = `<div class="flex items-center gap-1 rounded-full bg-slate-100 p-1 w-fit">${html}</div>`;
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem("moldinvest_lang", currentLang);
      renderAll();
    });
  });
}

function renderText() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const val = get(DICTIONARIES[currentLang], el.dataset.i18n);
    if (typeof val === "string") el.textContent = val;
  });
}

function renderServices() {
  const dict = DICTIONARIES[currentLang].services;
  const icons = ["🧑‍💼", "👥", "📊"];
  const bookingLinks = [
    "https://calendly.com/moldinvest/consultanta-1-la-1",
    "https://wa.me/37360000000?text=Salut%2C+vreau+sa+ma+inscriu+la+un+workshop+Moldinvest",
    "https://calendly.com/moldinvest/analiza-financiara"
  ];
  const grid = document.getElementById("services-grid");
  grid.innerHTML = dict.items.map((s, i) => `
    <div class="flex flex-col rounded-2xl border border-slate-100 bg-surface-light p-7 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all">
      <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-brand-blue text-white mb-5 text-xl">${icons[i]}</span>
      <h3 class="text-lg font-bold text-navy">${s.title}</h3>
      <p class="text-xs font-semibold uppercase tracking-wide text-brand-emerald mt-1">${s.subtitle}</p>
      <p class="mt-3 text-sm text-slate-600 flex-1">${s.desc}</p>
      <ul class="mt-4 space-y-2">
        ${s.bullets.map(b => `<li class="flex items-start gap-2 text-sm text-slate-600"><span class="text-brand-emerald mt-0.5">✓</span>${b}</li>`).join("")}
      </ul>
      <a href="${bookingLinks[i]}" target="_blank" rel="noopener noreferrer" class="mt-6 inline-flex items-center justify-center rounded-lg bg-brand-blue px-4 py-3 text-sm font-semibold text-white hover:bg-navy-light transition-colors">${dict.book}</a>
    </div>
  `).join("");
}

function computeKpis() {
  const stocks = portfolioData.stocks || [];
  const bonds = portfolioData.bonds || [];
  const stocksValue = stocks.reduce((s, x) => s + (Number(x.actiuni) || 0) * (Number(x.pretCurent) || 0), 0);
  const bondsValue = bonds.reduce((s, x) => s + (Number(x.sumaInvestita) || 0), 0);
  const totalValue = stocksValue + bondsValue;
  const bondsAnnualIncome = bonds.reduce((s, b) => s + (Number(b.sumaInvestita) || 0) * ((Number(b.rataCuponProcent) || 0) / 100), 0);
  const stocksCost = stocks.reduce((s, x) => s + (Number(x.actiuni) || 0) * (Number(x.pretMediu) || 0), 0);
  const stocksGain = stocksValue - stocksCost + stocks.reduce((s, x) => s + (Number(x.dividendeIncasate) || 0), 0);
  const totalCost = stocksCost + bondsValue;
  const avgYield = totalCost > 0 ? ((stocksGain + bondsAnnualIncome) / totalCost) * 100 : 0;
  return { totalValue, annualIncome: bondsAnnualIncome, avgYield };
}

function stockReturn(s) {
  const cost = (Number(s.actiuni) || 0) * (Number(s.pretMediu) || 0);
  const value = (Number(s.actiuni) || 0) * (Number(s.pretCurent) || 0);
  const div = Number(s.dividendeIncasate) || 0;
  if (cost <= 0) return 0;
  return ((value - cost + div) / cost) * 100;
}

function renderPortfolio() {
  const dict = DICTIONARIES[currentLang].portfolio;
  const kpi = computeKpis();
  document.getElementById("kpi-total").textContent = fmtMDL(kpi.totalValue);
  document.getElementById("kpi-income").textContent = fmtMDL(kpi.annualIncome);
  document.getElementById("kpi-yield").textContent = fmtPct(kpi.avgYield);

  const stocks = portfolioData.stocks || [];
  const stocksBody = document.getElementById("stocks-tbody");
  stocksBody.innerHTML = stocks.length === 0
    ? `<tr><td colspan="7" class="px-4 py-6 text-center text-slate-400">${dict.empty}</td></tr>`
    : stocks.map(s => {
        const totalValue = (Number(s.actiuni) || 0) * (Number(s.pretCurent) || 0);
        const ret = stockReturn(s);
        const retClass = ret >= 0 ? "text-brand-emerald" : "text-red-600";
        return `<tr class="border-t border-slate-100 hover:bg-slate-50">
          <td class="px-4 py-3 font-medium text-navy">${s.companie} <span class="text-slate-400 font-normal">(${s.ticker})</span></td>
          <td class="px-4 py-3 text-right">${s.actiuni}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(s.pretMediu)}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(s.pretCurent)}</td>
          <td class="px-4 py-3 text-right font-semibold">${fmtMDL(totalValue)}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(s.dividendeIncasate)}</td>
          <td class="px-4 py-3 text-right font-semibold ${retClass}">${ret >= 0 ? "+" : ""}${fmtPct(ret)}</td>
        </tr>`;
      }).join("");

  const bonds = portfolioData.bonds || [];
  const bondsBody = document.getElementById("bonds-tbody");
  bondsBody.innerHTML = bonds.length === 0
    ? `<tr><td colspan="6" class="px-4 py-6 text-center text-slate-400">${dict.empty}</td></tr>`
    : bonds.map(b => {
        const projected = (Number(b.sumaInvestita) || 0) * ((Number(b.rataCuponProcent) || 0) / 100);
        return `<tr class="border-t border-slate-100 hover:bg-slate-50">
          <td class="px-4 py-3 font-medium text-navy">${b.codEmisiune} <span class="text-slate-400 font-normal">— ${b.maturitate}</span></td>
          <td class="px-4 py-3 text-right">${fmtMDL(b.sumaInvestita)}</td>
          <td class="px-4 py-3 text-right">${fmtPct(b.rataCuponProcent)}</td>
          <td class="px-4 py-3 text-right">${b.frecventaPlata}</td>
          <td class="px-4 py-3 text-right">${fmtMDL(b.couponIncasat)}</td>
          <td class="px-4 py-3 text-right font-semibold text-brand-emerald">${fmtMDL(projected)}</td>
        </tr>`;
      }).join("");
}

function animateStats() {
  const targets = { "stat-community": 2000, "stat-portfolio": 20000000, "stat-hours": 10 };
  const suffixes = { "stat-community": "+", "stat-portfolio": " MDL", "stat-hours": "+" };
  Object.entries(targets).forEach(([id, target]) => {
    const el = document.getElementById(id);
    let start = null;
    const duration = 1500;
    function step(ts) {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      el.textContent = Math.floor(progress * target).toLocaleString("ro-MD") + suffixes[id];
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function renderAll() {
  renderLangSwitch();
  renderText();
  renderServices();
  renderPortfolio();
}

// Mobile menu toggle
document.getElementById("mobile-menu-btn").addEventListener("click", () => {
  const menu = document.getElementById("mobile-menu");
  const isOpen = !menu.classList.contains("hidden");
  menu.classList.toggle("hidden");
  document.getElementById("icon-menu").classList.toggle("hidden", !isOpen);
  document.getElementById("icon-close").classList.toggle("hidden", isOpen);
});
document.querySelectorAll(".mobile-link").forEach(a => {
  a.addEventListener("click", () => {
    document.getElementById("mobile-menu").classList.add("hidden");
    document.getElementById("icon-menu").classList.remove("hidden");
    document.getElementById("icon-close").classList.add("hidden");
  });
});

document.getElementById("footer-year").textContent = new Date().getFullYear();

// Load portfolio.json (must be served over http/https — file:// will fail
// due to browser fetch restrictions; use `vercel dev`, `npx serve`, or just
// deploy to Vercel to test).
fetch("./portfolio.json")
  .then(r => r.json())
  .then(data => { portfolioData = data; renderAll(); animateStats(); })
  .catch(err => {
    console.error("Nu s-a putut încărca portfolio.json:", err);
    renderAll();
    animateStats();
  });
</script>
